[workspace]
members = ["crates/kicad-mcp", "crates/easyeda-kicad"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Dragan Bojovic"]
repository = "https://github.com/Draganito/kicad-mcp"
homepage = "https://github.com/Draganito/kicad-mcp"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2", features = ["json", "tls"] }
